<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enhanced Form</title>

<style>

body{
    font-family: 'Segoe UI', sans-serif;
    background: #eef2f7;
    margin:0;
    padding:30px;
}

/* CONTAINER */
.container{
    max-width:850px;
    margin:auto;
}

/* FORM BOX */
.form-box{
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
    margin-bottom:40px;
    border-left:5px solid #007bff;
}

.form-box h2{
    text-align:center;
    margin-bottom:20px;
    color:#2c3e50;
}

/* INPUT */
.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
    color:#555;
}

input, select{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:14px;
    transition:0.3s;
}

input:focus, select:focus{
    border-color:#007bff;
    box-shadow:0 0 5px rgba(0,123,255,0.3);
    outline:none;
}

/* BUTTON */
button{
    width:100%;
    padding:11px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#0056b3;
}

/* TABLE BOX */
.table-box{
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
    border-left:5px solid #28a745;
}

.table-box h2{
    margin-bottom:15px;
    color:#2c3e50;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
}

th, td{
    padding:12px;
    border-bottom:1px solid #ddd;
}

th{
    background:#007bff;
    color:white;
}

tr:nth-child(even){
    background:#f8f9fa;
}

tr:hover{
    background:#eaf3ff;
    transition:0.2s;
}

</style>
</head>

<body>

<div class="container">

    <!-- FORM -->
    <div class="form-box">
        <h2>Student Registration</h2>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" placeholder="Enter your name">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="Enter your email">
        </div>

        <div class="form-group">
            <label>Course</label>
            <select>
                <option>EEE</option>
                <option>CSE</option>
                <option>ECE</option>
            </select>
        </div>

        <button>Register</button>
    </div>

    <!-- TABLE -->
    <div class="table-box">
        <h2>Registered Students</h2>

        <table>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Course</th>
            </tr>

            <tr>
                <td>Sri Prasanth</td>
                <td>mail@gmail.com</td>
                <td>EEE</td>
            </tr>

            <tr>
                <td>Vinu</td>
                <td>vinu@gmail.com</td>
                <td>CSE</td>
            </tr>

        </table>
    </div>

</div>

</body>
</html>
